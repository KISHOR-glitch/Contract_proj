# ─── Application ───────────────────────────────────────────────────────────────
spring.application.name=contracts-management

# ─── DataSource ────────────────────────────────────────────────────────────────
# Override via environment variables: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/contracts_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ───────────────────────────────────────────────────────────
# Use 'update' – let Hibernate create the schema if it's missing
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Prevent N+1 lazy-loading issues from leaking through open sessions
spring.jpa.open-in-view=false

# ─── Server ────────────────────────────────────────────────────────────────────
server.port=8081

# ─── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.seventhray.contracts=INFO
logging.level.org.springframework.web=WARN
